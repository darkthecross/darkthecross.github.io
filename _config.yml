# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Any sufficiently advanced technology is indistinguishable from magic.
email: darkthecross@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  This is the personal website of Mingxiang Fan (AKA darkthecross).
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://darkthecross.com" # the base hostname & protocol for your site
#twitter_username: jekyllrb
github_username:  darkthecross
linkedin_url: https://www.linkedin.com/in/%E6%98%8E%E7%A5%A5-%E6%A8%8A-44b091b4/
author: Mingxiang Fan

# Drop a real GA4 measurement ID (starts with "G-") here to enable analytics in production.
# google_analytics: G-XXXXXXXXXX

# Build settings
markdown: kramdown

# Default permalink for future posts that don't set their own override.
# The 12 existing posts each keep an explicit per-post `permalink:` + `redirect_from:`
# pair in their front matter so their old URLs keep working (see _posts/).
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-paginate-v2

# Pagination for the /blog/ chronological archive (jekyll-paginate-v2).
pagination:
  enabled: true
  per_page: 8
  permalink: '/page/:num/'
  title: ':title - page :num'
  sort_field: 'date'
  sort_reverse: true

# Auto-generated, auto-paginated archive pages per tag/category (jekyll-paginate-v2).
# Tags/categories are derived from post front matter — no separate data file to keep in sync.
autopages:
  enabled: true
  # This site only has the built-in `posts` collection, so the collection
  # autopages feature (which defaults to enabled) has nothing to generate.
  collections:
    enabled: false
  categories:
    enabled: true
    layouts:
      - category_archive.html
    title: 'Category: :cat'
    permalink: '/categories/:cat/'
  tags:
    enabled: true
    layouts:
      - tag_archive.html
    title: 'Tag: :tag'
    permalink: '/tags/:tag/'

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
